  theme: dark
  logoUrl: https://gamesphere.rs/img/logo.png
  favicon: https://gamesphere.rs/img/logo.png
  faviconSvg: https://gamesphere.rs/favicon.svg
  css: |
    .logo img {
      height: 2.25rem !important;
      width: auto !important;
      object-fit: contain !important;
    }
  navbar:
    - title: Status
      href: /
    - title: GameSphere Home
      href: https://gamesphere.rs
    - title: Client Dashboard
      href: https://gamesphere.rs/dashboard

