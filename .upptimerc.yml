sites:
  - name: GameSphere Website
    url: https://gamesphere.rs
    type: globalping
    icon: https://gamesphere.rs/favicon.svg

  - name: API Services
    url: https://gamesphere.rs/api/health
    icon: https://gamesphere.rs/favicon.svg

  - name: GameSphere Panel
    url: https://panel.gamesphere.rs
    icon: https://gamesphere.rs/favicon.svg

  - name: Database Engine
